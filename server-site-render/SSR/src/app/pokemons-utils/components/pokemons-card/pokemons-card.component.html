<div class="bg-blue-500 animate-fadeIn h-44 bg-opacity-25 rounded-lg shadow-md flex flex-col p-4 items-center justify-center cursor-pointer"
  [routerLink]="['/pokemons-detail', inputPokeCard().id]"
>
  <img
    [src]="pokemonsImage()"
    [alt]="inputPokeCard().name"
    class="w-24 h-24"
    width="96px"
    height="96px"
  />

  <div class="text-center mt-2">
    <h2 class="text-xl font-bold capitalize text-white">{{inputPokeCard().name}}</h2>
  </div>
</div>
